<div class="mt-6" [attr.aria-busy]="pending()">
  <div #googleButton class="flex min-w-0 justify-center" [class.pointer-events-none]="pending()" [attr.inert]="pending() ? '' : null"></div>
  @if(pending()){<p role="status" class="mt-3 text-center text-sm text-ink-3">Verificando tu cuenta…</p>}
  @if(error()){<p role="alert" class="mt-3 text-sm text-red-600">{{error()}}</p>}
  @if(visible()){<p class="mt-5 text-center text-xs text-ink-3">O continuá con tu correo</p>}
</div>
