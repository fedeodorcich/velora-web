<dialog
  #dialog
  class="overlay m-auto w-[calc(100vw-2rem)] max-w-md p-0 text-ink backdrop:bg-ground-deep/80 backdrop:backdrop-blur-sm"
  aria-labelledby="confirm-dialog-title"
  (close)="confirm.cancel()"
  (click)="onBackdropClick($event)"
>
  @if (confirm.request(); as request) {
    <div class="p-5">
      <h2 id="confirm-dialog-title" class="font-serif text-lg font-medium text-ink">
        {{ request.title }}
      </h2>
      <p class="mt-2 text-sm leading-relaxed text-ink-2">{{ request.message }}</p>
    </div>

    <div class="flex justify-end gap-2 border-t border-rule px-5 py-3">
      <button type="button" class="btn-secondary" (click)="confirm.cancel()">
        {{ request.cancelLabel }}
      </button>
      <button
        type="button"
        [class]="request.danger ? 'btn-danger' : 'btn-primary'"
        (click)="confirm.accept()"
      >
        {{ request.confirmLabel }}
      </button>
    </div>
  }
</dialog>
