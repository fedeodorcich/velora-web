<header class="no-print sticky top-0 z-30 border-b border-rule bg-ground/85 backdrop-blur">
  <nav class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a
      routerLink="/"
      class="flex items-center gap-2.5 font-serif text-xl font-medium tracking-tight text-cream"
      aria-label="DevCRM, ir al inicio"
    >
      <span class="h-2.5 w-2.5 border border-cyan/70 bg-cyan/20" aria-hidden="true"></span>
      DevCRM
    </a>

    @if (auth.isAuthenticated()) {
      <div class="hidden items-center gap-1 sm:flex">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="nav-tab-active"
            ariaCurrentWhenActive="page"
            class="nav-tab"
          >
            {{ link.label }}
          </a>
        }
      </div>

      <div class="hidden items-center gap-3 sm:flex">
        <span class="text-sm text-ink-3">{{ auth.user()?.name }}</span>
        <span class="h-4 w-px bg-rule" aria-hidden="true"></span>
        <button type="button" class="btn-ghost" (click)="logout()">Salir</button>
      </div>

      <button
        type="button"
        class="btn-ghost -mr-2 sm:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menú de navegación"
        (click)="toggleMenu()"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    }
  </nav>

  @if (auth.isAuthenticated() && menuOpen()) {
    <div class="border-t border-rule bg-ground-deep sm:hidden">
      <div class="mx-auto flex w-full max-w-6xl flex-col px-4 py-1 sm:px-6">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="nav-mobile-link-active"
            ariaCurrentWhenActive="page"
            class="nav-mobile-link"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
        <div class="flex items-center justify-between gap-3 py-3">
          <span class="text-sm text-ink-3">{{ auth.user()?.name }}</span>
          <button type="button" class="btn-ghost" (click)="logout()">Salir</button>
        </div>
      </div>
    </div>
  }
</header>
