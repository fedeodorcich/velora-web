<div class="flex min-h-screen flex-col">
  <app-navbar />

  <main [class]="mainClass()">
    <router-outlet />
  </main>

  <footer class="no-print mt-10 border-t border-rule bg-surface py-5 text-xs text-ink-3">
    <div
      class="mx-auto flex w-full max-w-6xl flex-col items-center gap-3 px-4 text-center sm:flex-row sm:justify-between sm:px-6 sm:text-left"
    >
      <p>VeloraCRM — Micro-CRM para desarrolladores y diseñadores freelance</p>

      <nav class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 sm:justify-end" aria-label="Legal y contacto">
        <a routerLink="/terminos" class="transition hover:text-ink">Términos</a>
        <a routerLink="/privacidad" class="transition hover:text-ink">Privacidad</a>
        <a routerLink="/terminos" fragment="arrepentimiento" class="transition hover:text-ink">Botón de arrepentimiento</a>
        <a routerLink="/terminos" fragment="cancelacion" class="transition hover:text-ink">Botón de baja</a>
        @if (legal.supportEmail) {
          <a [href]="'mailto:' + legal.supportEmail" class="transition hover:text-ink">Contacto</a>
        } @else {
          <a routerLink="/terminos" fragment="contacto" class="transition hover:text-ink">Contacto</a>
        }
      </nav>
    </div>
  </footer>
</div>

<app-confirm-dialog />
